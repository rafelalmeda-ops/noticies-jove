name: Notícies del dia

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 05:30 o 06:30 a Catalunya (segons l'hora d'estiu)
  workflow_dispatch:        # permet executar-ho a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Genera les notícies
        run: python fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Publica
        run: |
          git config user.name "noticies-bot"
          git config user.email "noticies-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || git commit -m "Notícies del $(date +%F)"
          git push
